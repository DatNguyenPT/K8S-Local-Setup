apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
data:
  init-script.sql: |
    CREATE TABLE users (
      id SERIAL PRIMARY KEY,
      name VARCHAR(100),
      email VARCHAR(100)
    );

    INSERT INTO users (name, email) VALUES
      ('John Doe', 'john.doe@example.com'),
      ('Jane Doe', 'jane.doe@example.com'),
      ('Alice Smith', 'alice.smith@example.com');
